<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>토스 미국주식 급등주 스캐너</title>
<style>
:root{--bg:#0f1115;--card:#181b21;--muted:#9aa4b2;--text:#f5f7fa;--line:#2a2f38;--good:#35d07f;--bad:#ff6464}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}h1{font-size:23px;margin:4px 0 6px}.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.card,.result{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
textarea,input{width:100%;background:#11141a;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
textarea{min-height:110px}button{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700}
.settings,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings label,.k{font-size:12px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center}.sym{font-size:22px;font-weight:800}.price{font-size:28px;font-weight:800;margin-top:8px}
.badge{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}.signal{color:var(--good)}.nosignal{color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}.metric{background:#0f1217;border-radius:12px;padding:10px}
.targets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.t{background:#0f1217;border-radius:12px;padding:10px;text-align:center}.t small{display:block;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>토스 미국주식 급등주 스캐너</h1>
<div class="sub">조건 감지 + VWAP/RVOL + 손절·익절 가격 계산</div>
<div class="card"><b>감시 종목</b><textarea id="symbols">AAPL
NVDA
TSLA
AMD</textarea></div>
<div class="card">
<div class="settings">
<div><label>최소 상승률 %</label><input id="min_change_pct" type="number" value="10"></div>
<div><label>최소 RVOL</label><input id="min_rvol" type="number" value="3"></div>
<div><label>최소 거래량</label><input id="min_volume" type="number" value="1000000"></div>
<div><label>손절 %</label><input id="stop_loss_pct" type="number" value="3"></div>
<div><label>1차 익절 %</label><input id="target1_pct" type="number" value="5"></div>
<div><label>2차 익절 %</label><input id="target2_pct" type="number" value="10"></div>
</div>
<p><label><input id="require_vwap" type="checkbox" checked style="width:auto"> VWAP 위일 때만 신호</label></p>
</div>
<button id="btn" onclick="scan()">지금 스캔</button>
<div id="status" class="sub" style="margin-top:10px"></div><div id="results"></div>
<div class="sub">무료 공개 시세는 지연될 수 있습니다. 실제 주문 전 토스증권의 현재가와 호가를 확인하세요.</div>
</div>
<script>
const $=id=>document.getElementById(id);
const money=v=>'$'+(Math.abs(v)<1?Number(v).toFixed(4):Number(v).toFixed(2));
async function scan(){
 $('btn').disabled=true;$('status').textContent='시세 확인 중...';$('results').innerHTML='';
 const symbols=$('symbols').value.split(/[\n,\s]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
 const settings={min_change_pct:+$('min_change_pct').value,min_rvol:+$('min_rvol').value,min_volume:+$('min_volume').value,
 stop_loss_pct:+$('stop_loss_pct').value,target1_pct:+$('target1_pct').value,target2_pct:+$('target2_pct').value,require_vwap:$('require_vwap').checked};
 try{
  const res=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols,settings})});
  const data=await res.json(); $('status').textContent='스캔 완료 · '+new Date().toLocaleTimeString('ko-KR');
  for(const r of data.results){
   const d=document.createElement('div');d.className='result';
   if(r.error){d.innerHTML=`<b>${r.symbol}</b><p class="neg">${r.error}</p>`}
   else d.innerHTML=`<div class="top"><div class="sym">${r.symbol}</div><span class="badge ${r.signal?'signal':'nosignal'}">${r.signal?'★ 조건 충족':'대기'}</span></div>
   <div class="price">${money(r.price)}</div><div class="${r.change_pct>=0?'pos':'neg'}">${r.change_pct>=0?'+':''}${r.change_pct.toFixed(2)}%</div>
   <div class="grid"><div class="metric"><div class="k">거래량</div><b>${Number(r.volume).toLocaleString()}</b></div><div class="metric"><div class="k">RVOL</div><b>${r.rvol.toFixed(2)}x</b></div>
   <div class="metric"><div class="k">VWAP</div><b>${money(r.vwap)}</b></div><div class="metric"><div class="k">위치</div><b>${r.price>=r.vwap?'VWAP 위':'VWAP 아래'}</b></div></div>
   <div class="targets"><div class="t"><small>손절</small><b>${money(r.stop)}</b></div><div class="t"><small>1차 익절</small><b>${money(r.target1)}</b></div><div class="t"><small>2차 익절</small><b>${money(r.target2)}</b></div></div>`;
   $('results').appendChild(d);
  }
 }catch(e){$('status').textContent='오류: '+e.message}finally{$('btn').disabled=false}
}
</script>
</body></html>
